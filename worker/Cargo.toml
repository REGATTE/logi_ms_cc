[package]
name = "mx-creative-worker"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Low-resource Linux worker for the Logitech MX Creative Keypad"

[[bin]]
name = "mxcc-worker"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
x11rb = "0.14"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
