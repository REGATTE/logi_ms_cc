[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-creative-control"
version = "0.2.0"
description = "A focused Ubuntu configurator for the Logitech MX Creative Keypad"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.10.2", "shiboken6==6.10.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mx-creative-control = "mxcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
